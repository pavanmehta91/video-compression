[project]
name = "video-compression"
version = "0.1.0"
description = "Compress Mac and Android video folders locally with VideoToolbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
video-compress = "video_compression.cli:main"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
